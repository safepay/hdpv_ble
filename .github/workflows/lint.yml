name: Lint

on:
  # Branch pushes are covered by the pull_request trigger, so push is limited to
  # main to stop every commit on an open PR running this twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint the code
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: "actions/checkout@v4"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .

      - name: Run codespell
        run: codespell -L hass
