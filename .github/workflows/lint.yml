name: Lint

on:
  # Nothing reaches main except through a pull request, and the PR run already
  # checks the merge result, so there is no push trigger: it would only re-run
  # what was just validated. Use workflow_dispatch to check main on demand.
  pull_request:
    # ruff and mypy only read Python, so this filter is safe for them. Anything
    # that reads the whole repository must not live in this workflow - see
    # codespell.yml, which is unfiltered for that reason.
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions: {}

# A second push to a PR cancels the run still in flight for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the code
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: "actions/checkout@v7"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.2"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .
