---
name: "Bug report"
description: "Report a bug with the integration"
labels: "Bug"
body:
- type: markdown
  attributes:
    value: |
      Please check the [existing issues](https://github.com/safepay/hdpv_ble/issues?q=is%3Aissue+label%3A%22Bug%22) first, and open one issue per problem.
- type: textarea
  attributes:
    label: "What happened"
    description: "What you did, what you expected, and what the shade did instead. Include the steps to reproduce it if it isn't obvious."
  validations:
    required: true
- type: input
  attributes:
    label: "Shade type ID"
    description: "From the PowerView app, under *product info → type ID*. Almost all shade behaviour is chosen from this number."
    placeholder: "8"
- type: textarea
  attributes:
    label: "Diagnostics"
    description: |
      From the shade's device page in Home Assistant, **⋮ → Download diagnostics**, then drag the file into this box.

      This is the single most useful thing you can attach: it carries the shade's type, capability flags, the raw Bluetooth advertisement and the decoded state. The home key, home ID and serial number are redacted, but the shade's own name is not — if you would rather not post that, and you have a G3 hub, run [`scripts/shade_report.py`](https://github.com/safepay/hdpv_ble/blob/main/scripts/shade_report.py) and paste its output instead.

      If you can't produce either, say so here and why.
  validations:
    required: true
- type: textarea
  attributes:
    label: "Debug logs"
    description: |
      Optional, but usually decisive for anything involving movement, pairing or connection failures.

      Enable debug logging on the integration, reproduce the problem, then disable it again — Home Assistant offers the log for download. Drag the file in here.
