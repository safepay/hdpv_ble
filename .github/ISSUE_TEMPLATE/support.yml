---
name: "Support"
description: "Ask a question, get help with the integration"
labels: "question"
body:
- type: markdown
  attributes:
    value: |
      Please check the [existing questions](https://github.com/safepay/hdpv_ble/issues?q=is%3Aissue+label%3Aquestion) first. If something is broken rather than unclear, the [bug report](https://github.com/safepay/hdpv_ble/issues/new?template=bug.yml) form asks for the details needed to diagnose it.
- type: textarea
  attributes:
    label: "What do you need help with"
    description: "Your question, and what you have tried so far."
  validations:
    required: true
- type: input
  attributes:
    label: "Shade type ID"
    description: "From the PowerView app, under *product info → type ID*, if the question is about a particular shade."
    placeholder: "8"
- type: checkboxes
  attributes:
    label: "Setup"
    description: "Tick whatever applies — it usually changes the answer."
    options:
      - label: "Home Assistant reaches my shades through an ESPHome or other Bluetooth proxy"
      - label: "I have a PowerView G3 hub configured in the integration"
